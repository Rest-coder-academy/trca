<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1180" viewBox="0 0 2140 1180"><rect x="0" y="0" width="2140" height="1161" fill="#ffffff"/><text x="48" y="59" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">RCA PAYMENT GATEWAY · THE FLOW</text><text x="48" y="99" font-family="Montserrat" font-size="30" font-weight="800" fill="#03084c" letter-spacing="-0.3" xml:space="preserve">Three screens, one job: turn an enquiry into a paid </text><text x="48" y="137" font-family="Montserrat" font-size="30" font-weight="800" fill="#03084c" letter-spacing="-0.3" xml:space="preserve">seat.</text><text x="48" y="171" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">Built on Rest Coder Academy's own palette and Montserrat. The enquiry form already collects name, mobile </text><text x="48" y="195" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">and email — this extends that form rather than asking for it twice. Amount shown as ₹35,000 (the SOW </text><text x="48" y="219" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">figure); the deposit variant is on the next board.</text><rect x="48" y="258" width="392" height="1" fill="#e3e7ec"/><rect x="48" y="819" width="392" height="1" fill="#e3e7ec"/><rect x="48" y="258" width="1" height="562" fill="#e3e7ec"/><rect x="439" y="258" width="1" height="562" fill="#e3e7ec"/><rect x="49" y="259" width="390" height="560" fill="#f8fafb"/><rect x="49" y="259" width="390" height="560" fill="#f8fafb"/><rect x="49" y="259" width="390" height="56" fill="#03084c"/><g transform="translate(65 277) scale(0.833) translate(0 0)"><path d="m15 18-6-6 6-6"></path></g><text x="95" y="292.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Java Full Stack</text><rect x="65" y="335" width="358" height="313" rx="14" fill="#ffffff"/><rect x="65" y="335" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="647" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="335" width="1" height="313" fill="#e3e7ec"/><rect x="422" y="335" width="1" height="313" fill="#e3e7ec"/><text x="84" y="365" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.66" xml:space="preserve">NEXT BATCH</text><text x="84" y="392" font-family="Montserrat" font-size="19" font-weight="700" fill="#03084c" xml:space="preserve">Java Full Stack</text><text x="84" y="413" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">For freshers &amp; working professionals</text><g transform="translate(84 426.5) scale(0.625) translate(0 0)"><path d="M20 6 9 17l-5-5"></path></g><text x="108" y="439" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">4 months · offline, Bengaluru</text><g transform="translate(84 449.5) scale(0.625) translate(0 0)"><path d="M20 6 9 17l-5-5"></path></g><text x="108" y="462" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Starts Wed 24 May, 10:00 AM</text><g transform="translate(84 472.5) scale(0.625) translate(0 0)"><path d="M20 6 9 17l-5-5"></path></g><text x="108" y="485" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Trainer: Uday Pawar S</text><text x="84" y="527" font-family="Montserrat" font-size="26" font-weight="800" fill="#03084c" xml:space="preserve">₹35,000</text><text x="202.484" y="527" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">course fee</text><rect x="84" y="552" width="320" height="52" rx="8" fill="#ff9800"/><text x="185.109" y="583.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Book your seat</text><text x="165.453" y="626" font-family="Montserrat" font-size="12" font-weight="400" fill="#8a94a1" xml:space="preserve">Or talk to a counsellor first</text><text x="48" y="845" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">1 · COURSE CARD</text><text x="48" y="868" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">One batch, one price, one button. “Book your seat” beats </text><text x="48" y="888" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">“Pay now” — it names what you get, not what you lose.</text><rect x="476" y="258" width="392" height="1" fill="#e3e7ec"/><rect x="476" y="1019" width="392" height="1" fill="#e3e7ec"/><rect x="476" y="258" width="1" height="762" fill="#e3e7ec"/><rect x="867" y="258" width="1" height="762" fill="#e3e7ec"/><rect x="477" y="259" width="390" height="760" fill="#f8fafb"/><rect x="477" y="259" width="390" height="760" fill="#f8fafb"/><rect x="477" y="259" width="390" height="56" fill="#03084c"/><g transform="translate(493 277) scale(0.833) translate(0 0)"><path d="m15 18-6-6 6-6"></path></g><text x="523" y="292.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Book your seat</text><text x="493" y="344" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">FULL NAME</text><rect x="493" y="353" width="358" height="50" rx="8" fill="#ffffff"/><rect x="493" y="353" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="402" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="353" width="1" height="50" fill="#e3e7ec"/><rect x="850" y="353" width="1" height="50" fill="#e3e7ec"/><text x="508" y="383.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">Priya R</text><text x="493" y="430" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">MOBILE</text><rect x="493" y="439" width="358" height="50" rx="8" fill="#ffffff"/><rect x="493" y="439" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="488" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="439" width="1" height="50" fill="#e3e7ec"/><rect x="850" y="439" width="1" height="50" fill="#e3e7ec"/><text x="508" y="469.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">+91 98450 12345</text><text x="493" y="516" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">EMAIL</text><rect x="493" y="525" width="358" height="50" rx="8" fill="#ffffff"/><rect x="493" y="525" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="574" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="525" width="1" height="50" fill="#e3e7ec"/><rect x="850" y="525" width="1" height="50" fill="#e3e7ec"/><text x="508" y="555.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">priya.r@gmail.com</text><text x="493" y="602" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">REFERRAL CODE</text><rect x="493" y="611" width="358" height="59" rx="8" fill="#f1f9f4"/><rect x="493" y="611" width="358" height="1" fill="#1a7f4b"/><rect x="493" y="669" width="358" height="1" fill="#1a7f4b"/><rect x="493" y="611" width="1" height="59" fill="#1a7f4b"/><rect x="850" y="611" width="1" height="59" fill="#1a7f4b"/><g transform="translate(508 631.5) scale(0.75) translate(0 0)"><path d="M20 12.5 12.5 20 3 10.5V3h7.5z"></path><circle cx="7.5" cy="7.5" r="1.2"></circle></g><text x="536" y="638" font-family="Montserrat" font-size="14" font-weight="700" fill="#1a7f4b" xml:space="preserve">KULLI applied</text><text x="536" y="654" font-family="Montserrat" font-size="11.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Referral code recognised</text><g transform="translate(819 632) scale(0.708) translate(0 0)"><path d="M20 6 9 17l-5-5"></path></g><rect x="493" y="686" width="358" height="61" rx="12" fill="#ffffff"/><rect x="493" y="686" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="746" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="686" width="1" height="61" fill="#e3e7ec"/><rect x="850" y="686" width="1" height="61" fill="#e3e7ec"/><text x="510" y="724" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">Course fee</text><text x="740.516" y="724" font-family="Montserrat" font-size="22" font-weight="800" fill="#03084c" xml:space="preserve">₹35,000</text><rect x="477" y="910" width="390" height="109" fill="#ffffff"/><rect x="477" y="910" width="390" height="1" fill="#e3e7ec"/><rect x="493" y="927" width="358" height="52" rx="8" fill="#ff9800"/><g transform="translate(575.484 944) scale(0.75) translate(0 0)"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></g><text x="602.484" y="958.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Pay ₹35,000 securely</text><g transform="translate(531.234 989.5) scale(0.542) translate(0 0)"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></g><text x="550.234" y="1000" font-family="Montserrat" font-size="11.5" font-weight="400" fill="#8a94a1" xml:space="preserve">Secured by Razorpay · UPI, cards, net banking</text><text x="476" y="1045" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">2 · CHECKOUT</text><text x="476" y="1068" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Details pre-filled from the enquiry. The referral code sits in </text><text x="476" y="1088" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">the form, not behind a link — see the next board for why </text><text x="476" y="1108" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">that matters.</text><rect x="904" y="258" width="392" height="1" fill="#e3e7ec"/><rect x="904" y="959" width="392" height="1" fill="#e3e7ec"/><rect x="904" y="258" width="1" height="702" fill="#e3e7ec"/><rect x="1295" y="258" width="1" height="702" fill="#e3e7ec"/><rect x="905" y="259" width="390" height="700" fill="#f8fafb"/><rect x="905" y="259" width="390" height="700" fill="#f8fafb"/><rect x="905" y="259" width="390" height="56" fill="#03084c"/><text x="921" y="292.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Rest Coder Academy</text><rect x="1068" y="347" width="64" height="64" rx="999" fill="#1a7f4b"/><g transform="translate(1085 364) scale(1.25) translate(0 0)"><path d="M20 6 9 17l-5-5"></path></g><text x="985.172" y="450" font-family="Montserrat" font-size="22" font-weight="800" fill="#03084c" xml:space="preserve">Your seat is booked</text><text x="953.063" y="480" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">₹35,000 received. A receipt is on its way to </text><text x="1007.031" y="502" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">your email and WhatsApp.</text><rect x="921" y="532" width="358" height="234" rx="12" fill="#ffffff"/><rect x="921" y="532" width="358" height="1" fill="#e3e7ec"/><rect x="921" y="765" width="358" height="1" fill="#e3e7ec"/><rect x="921" y="532" width="1" height="234" fill="#e3e7ec"/><rect x="1278" y="532" width="1" height="234" fill="#e3e7ec"/><text x="940" y="562" font-family="Montserrat" font-size="11" font-weight="700" fill="#8a94a1" letter-spacing="0.66" xml:space="preserve">WHAT HAPPENS NEXT</text><rect x="940" y="579" width="26" height="26" rx="999" fill="#03084c"/><text x="950.641" y="596.5" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffffff" xml:space="preserve">1</text><text x="978" y="593" font-family="Montserrat" font-size="14" font-weight="700" fill="#03084c" xml:space="preserve">We call you within a day</text><text x="978" y="614" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Uday confirms your batch and answers </text><text x="978" y="634" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">anything left.</text><rect x="940" y="653" width="26" height="26" rx="999" fill="#03084c"/><text x="949.453" y="670.5" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffffff" xml:space="preserve">2</text><text x="978" y="667" font-family="Montserrat" font-size="14" font-weight="700" fill="#03084c" xml:space="preserve">Join the batch WhatsApp group</text><text x="978" y="688" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Timings, address and material land there.</text><rect x="940" y="707" width="26" height="26" rx="999" fill="#03084c"/><text x="949.438" y="724.5" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffffff" xml:space="preserve">3</text><text x="978" y="721" font-family="Montserrat" font-size="14" font-weight="700" fill="#03084c" xml:space="preserve">Class starts Wed 24 May</text><text x="978" y="742" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">10:00 AM at the Bengaluru centre.</text><rect x="921" y="784" width="358" height="64" rx="12" fill="#ffffff"/><rect x="921" y="784" width="358" height="1" fill="#e3e7ec"/><rect x="921" y="847" width="358" height="1" fill="#e3e7ec"/><rect x="921" y="784" width="1" height="64" fill="#e3e7ec"/><rect x="1278" y="784" width="1" height="64" fill="#e3e7ec"/><g transform="translate(936 806) scale(0.833) translate(0 0)"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18.5h2"></path></g><text x="966" y="812" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Any questions?</text><text x="966" y="829" font-family="Montserrat" font-size="14" font-weight="700" fill="#03084c" xml:space="preserve">8073762257</text><text x="904" y="985" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">3 · CONFIRMATION</text><text x="904" y="1008" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Money just left their hands for a 4-month commitment. </text><text x="904" y="1028" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Three concrete next steps and a phone number do more </text><text x="904" y="1048" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">than a thank-you.</text><text x="1332" y="271" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">MOBILE ONLY, DELIBERATELY</text><text x="1332" y="294" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Their audience is freshers and working </text><text x="1332" y="315" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">professionals in Bengaluru on Android. The </text><text x="1332" y="336" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">desktop layout is the same column centred — </text><text x="1332" y="357" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">nothing new to design.</text><text x="1332" y="392" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">RAZORPAY HOSTED, NOT EMBEDDED</text><text x="1332" y="415" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Same pattern already built for Kulli Stores. No </text><text x="1332" y="436" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">card data touches RCA's servers and no PCI </text><text x="1332" y="457" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">scope. The trade is a redirect, which the </text><text x="1332" y="478" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">confirmation screen absorbs.</text><text x="1332" y="513" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">“OR TALK TO A COUNSELLOR FIRST”</text><text x="1332" y="536" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">The enquiry funnel is what works today. </text><text x="1332" y="557" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Payment is added beside it, not in front of it — </text><text x="1332" y="578" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">removing that link would trade a working funnel </text><text x="1332" y="599" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">for an untested one.</text><text x="1332" y="634" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">RECEIPT ON WHATSAPP</text><text x="1332" y="657" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Their audience lives there, and the batch group </text><text x="1332" y="678" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">is already the delivery channel. Email alone gets </text><text x="1332" y="699" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">missed.</text></svg>