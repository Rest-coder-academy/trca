<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320"><rect x="0" y="0" width="1900" height="1302" fill="#ffffff"/><text x="48" y="59" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">RCA PAYMENT GATEWAY · THE DECISION THAT PAYS US</text><text x="48" y="99" font-family="Montserrat" font-size="30" font-weight="800" fill="#03084c" letter-spacing="-0.3" xml:space="preserve">The referral field is not a coupon. It is the invoice.</text><text x="48" y="133" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">OPERATIONS.md is explicit: </text><text x="258.813" y="133" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">“the KULLI code count at checkout is the billing source of truth”</text><text x="735.891" y="133" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">, on a deal of 1–3% </text><text x="48" y="157" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">of ₹35,000, online payments only. Every design choice around that field has a rupee value.</text><rect x="48" y="196" width="946" height="173" rx="14" fill="#fdf3f2"/><rect x="48" y="196" width="946" height="1" fill="#c0392b"/><rect x="48" y="368" width="946" height="1" fill="#c0392b"/><rect x="48" y="196" width="1" height="173" fill="#c0392b"/><rect x="993" y="196" width="1" height="173" fill="#c0392b"/><g transform="translate(71 219) scale(0.833) translate(0 0)"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17.5v.01"></path></g><text x="101" y="238" font-family="Montserrat" font-size="18" font-weight="800" fill="#333333" xml:space="preserve">The default checkout pattern — “Have a coupon?” behind a link — quietly zeroes the rev-</text><text x="101" y="264" font-family="Montserrat" font-size="18" font-weight="800" fill="#333333" xml:space="preserve">share.</text><text x="101" y="296" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">A student who came through Kulli &amp; Co and never opens that link pays RCA in full and counts as organic. The </text><text x="101" y="318" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">money is collected, the attribution is not, and nothing anywhere reports an error. At 1–3% of ₹35,000 that is ₹350–</text><text x="101" y="340" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">1,050 lost per student, silently.</text><rect x="48" y="399" width="392" height="1" fill="#e3e7ec"/><rect x="48" y="1160" width="392" height="1" fill="#e3e7ec"/><rect x="48" y="399" width="1" height="762" fill="#e3e7ec"/><rect x="439" y="399" width="1" height="762" fill="#e3e7ec"/><rect x="49" y="400" width="390" height="760" fill="#f8fafb"/><rect x="49" y="400" width="390" height="760" fill="#f8fafb"/><rect x="49" y="400" width="390" height="56" fill="#03084c"/><g transform="translate(65 418) scale(0.833) translate(0 0)"><path d="m15 18-6-6 6-6"></path></g><text x="95" y="433.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Book your seat</text><text x="65" y="485" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">FULL NAME</text><rect x="65" y="494" width="358" height="50" rx="8" fill="#ffffff"/><rect x="65" y="494" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="543" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="494" width="1" height="50" fill="#e3e7ec"/><rect x="422" y="494" width="1" height="50" fill="#e3e7ec"/><text x="80" y="524.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">Priya R</text><text x="65" y="571" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">MOBILE</text><rect x="65" y="580" width="358" height="50" rx="8" fill="#ffffff"/><rect x="65" y="580" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="629" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="580" width="1" height="50" fill="#e3e7ec"/><rect x="422" y="580" width="1" height="50" fill="#e3e7ec"/><text x="80" y="610.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">+91 98450 12345</text><text x="65" y="657" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">EMAIL</text><rect x="65" y="666" width="358" height="50" rx="8" fill="#ffffff"/><rect x="65" y="666" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="715" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="666" width="1" height="50" fill="#e3e7ec"/><rect x="422" y="666" width="1" height="50" fill="#e3e7ec"/><text x="80" y="696.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">priya.r@gmail.com</text><text x="65" y="743" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">REFERRAL CODE</text><rect x="65" y="752" width="358" height="59" rx="8" fill="#f1f9f4"/><rect x="65" y="752" width="358" height="1" fill="#1a7f4b"/><rect x="65" y="810" width="358" height="1" fill="#1a7f4b"/><rect x="65" y="752" width="1" height="59" fill="#1a7f4b"/><rect x="422" y="752" width="1" height="59" fill="#1a7f4b"/><g transform="translate(80 772.5) scale(0.75) translate(0 0)"><path d="M20 12.5 12.5 20 3 10.5V3h7.5z"></path><circle cx="7.5" cy="7.5" r="1.2"></circle></g><text x="108" y="779" font-family="Montserrat" font-size="14" font-weight="700" fill="#1a7f4b" xml:space="preserve">KULLI applied</text><text x="108" y="795" font-family="Montserrat" font-size="11.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Referral code recognised</text><g transform="translate(391 773) scale(0.708) translate(0 0)"><path d="M20 6 9 17l-5-5"></path></g><rect x="65" y="827" width="358" height="61" rx="12" fill="#ffffff"/><rect x="65" y="827" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="887" width="358" height="1" fill="#e3e7ec"/><rect x="65" y="827" width="1" height="61" fill="#e3e7ec"/><rect x="422" y="827" width="1" height="61" fill="#e3e7ec"/><text x="82" y="865" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">Course fee</text><text x="312.516" y="865" font-family="Montserrat" font-size="22" font-weight="800" fill="#03084c" xml:space="preserve">₹35,000</text><rect x="49" y="1051" width="390" height="109" fill="#ffffff"/><rect x="49" y="1051" width="390" height="1" fill="#e3e7ec"/><rect x="65" y="1068" width="358" height="52" rx="8" fill="#ff9800"/><g transform="translate(147.484 1085) scale(0.75) translate(0 0)"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></g><text x="174.484" y="1099.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Pay ₹35,000 securely</text><g transform="translate(103.234 1130.5) scale(0.542) translate(0 0)"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></g><text x="122.234" y="1141" font-family="Montserrat" font-size="11.5" font-weight="400" fill="#8a94a1" xml:space="preserve">Secured by Razorpay · UPI, cards, net banking</text><text x="48" y="1186" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">ARRIVED VIA ?REF=KULLI</text><text x="48" y="1209" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Code pre-filled and confirmed in green before they reach </text><text x="48" y="1229" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">the pay button. Nothing to remember, nothing to type, </text><text x="48" y="1249" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">nothing to skip.</text><rect x="476" y="399" width="392" height="1" fill="#e3e7ec"/><rect x="476" y="1160" width="392" height="1" fill="#e3e7ec"/><rect x="476" y="399" width="1" height="762" fill="#e3e7ec"/><rect x="867" y="399" width="1" height="762" fill="#e3e7ec"/><rect x="477" y="400" width="390" height="760" fill="#f8fafb"/><rect x="477" y="400" width="390" height="760" fill="#f8fafb"/><rect x="477" y="400" width="390" height="56" fill="#03084c"/><g transform="translate(493 418) scale(0.833) translate(0 0)"><path d="m15 18-6-6 6-6"></path></g><text x="523" y="433.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Book your seat</text><text x="493" y="485" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">FULL NAME</text><rect x="493" y="494" width="358" height="50" rx="8" fill="#ffffff"/><rect x="493" y="494" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="543" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="494" width="1" height="50" fill="#e3e7ec"/><rect x="850" y="494" width="1" height="50" fill="#e3e7ec"/><text x="508" y="524.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">Priya R</text><text x="493" y="571" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">MOBILE</text><rect x="493" y="580" width="358" height="50" rx="8" fill="#ffffff"/><rect x="493" y="580" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="629" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="580" width="1" height="50" fill="#e3e7ec"/><rect x="850" y="580" width="1" height="50" fill="#e3e7ec"/><text x="508" y="610.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">+91 98450 12345</text><text x="493" y="657" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">EMAIL</text><rect x="493" y="666" width="358" height="50" rx="8" fill="#ffffff"/><rect x="493" y="666" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="715" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="666" width="1" height="50" fill="#e3e7ec"/><rect x="850" y="666" width="1" height="50" fill="#e3e7ec"/><text x="508" y="696.5" font-family="Montserrat" font-size="15" font-weight="600" fill="#333333" xml:space="preserve">priya.r@gmail.com</text><text x="493" y="743" font-family="Montserrat" font-size="11.5" font-weight="700" fill="#8a94a1" letter-spacing="0.46" xml:space="preserve">REFERRAL CODE</text><rect x="493" y="752" width="260" height="50" rx="8" fill="#ffffff"/><rect x="493" y="752" width="260" height="1" fill="#e3e7ec"/><rect x="493" y="801" width="260" height="1" fill="#e3e7ec"/><rect x="493" y="752" width="1" height="50" fill="#e3e7ec"/><rect x="752" y="752" width="1" height="50" fill="#e3e7ec"/><text x="508" y="782" font-family="Montserrat" font-size="14" font-weight="400" fill="#8a94a1" xml:space="preserve">Referral code</text><rect x="761" y="752" width="90" height="1" fill="#146389"/><rect x="761" y="801" width="90" height="1" fill="#146389"/><rect x="761" y="752" width="1" height="50" fill="#146389"/><rect x="850" y="752" width="1" height="50" fill="#146389"/><text x="784.672" y="782" font-family="Montserrat" font-size="14" font-weight="700" fill="#146389" xml:space="preserve">Apply</text><rect x="493" y="818" width="358" height="61" rx="12" fill="#ffffff"/><rect x="493" y="818" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="878" width="358" height="1" fill="#e3e7ec"/><rect x="493" y="818" width="1" height="61" fill="#e3e7ec"/><rect x="850" y="818" width="1" height="61" fill="#e3e7ec"/><text x="510" y="856" font-family="Montserrat" font-size="14" font-weight="400" fill="#4a4a4a" xml:space="preserve">Course fee</text><text x="740.516" y="856" font-family="Montserrat" font-size="22" font-weight="800" fill="#03084c" xml:space="preserve">₹35,000</text><rect x="477" y="1051" width="390" height="109" fill="#ffffff"/><rect x="477" y="1051" width="390" height="1" fill="#e3e7ec"/><rect x="493" y="1068" width="358" height="52" rx="8" fill="#ff9800"/><g transform="translate(575.484 1085) scale(0.75) translate(0 0)"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></g><text x="602.484" y="1099.5" font-family="Montserrat" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve">Pay ₹35,000 securely</text><g transform="translate(531.234 1130.5) scale(0.542) translate(0 0)"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></g><text x="550.234" y="1141" font-family="Montserrat" font-size="11.5" font-weight="400" fill="#8a94a1" xml:space="preserve">Secured by Razorpay · UPI, cards, net banking</text><text x="476" y="1186" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">ARRIVED DIRECTLY</text><text x="476" y="1209" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">Field still visible and empty — never collapsed behind a link. </text><text x="476" y="1229" font-family="Montserrat" font-size="13" font-weight="400" fill="#4a4a4a" xml:space="preserve">A student told “mention Kulli” can act on it.</text><text x="904" y="412" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">THE LINK DOES THE WORK</text><text x="904" y="435" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Every Kulli &amp; Co touchpoint links to </text><text x="1141.484" y="435" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">rca.in/enrol?</text><text x="904" y="456" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">ref=KULLI</text><text x="971.734" y="456" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">. The field is a fallback for word of </text><text x="904" y="477" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">mouth, not the mechanism.</text><text x="904" y="512" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">SHOW IT, DON'T HIDE IT</text><text x="904" y="535" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Always rendered, never behind a disclosure. One </text><text x="904" y="556" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">extra visible field costs a little conversion; a missed </text><text x="904" y="577" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">code costs the whole fee's share.</text><text x="904" y="612" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">CONFIRM IT VISIBLY</text><text x="904" y="635" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Green state before payment. A code that silently </text><text x="904" y="656" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">fails to apply is worse than no field — it looks </text><text x="904" y="677" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">handled and isn't.</text><text x="904" y="712" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">PERSIST IT</text><text x="904" y="735" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Store the ref on first landing, not just on the enrol </text><text x="904" y="756" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">page. Students browse the course pages before </text><text x="904" y="777" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">they pay.</text><text x="904" y="812" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">RECONCILE MONTHLY</text><text x="904" y="835" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Razorpay's notes field carries the code into the </text><text x="904" y="856" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">payment record, so the count is queryable rather </text><text x="904" y="877" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">than counted by hand for #51's dashboard.</text></svg>