<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840"><rect x="0" y="0" width="1500" height="814" fill="#ffffff"/><text x="48" y="59" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">RCA PAYMENT GATEWAY · BUILD NOTES</text><text x="48" y="99" font-family="Montserrat" font-size="30" font-weight="800" fill="#03084c" letter-spacing="-0.3" xml:space="preserve">What this needs from the existing app.</text><text x="48" y="133" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">Not a rebuild. The site already has the form, the fields and a backend — this adds a payment step beside </text><text x="48" y="157" font-family="Montserrat" font-size="15" font-weight="400" fill="#4a4a4a" xml:space="preserve">them.</text><rect x="48" y="196" width="902" height="1" fill="#e3e7ec"/><rect x="48" y="765" width="902" height="1" fill="#e3e7ec"/><rect x="48" y="196" width="1" height="570" fill="#e3e7ec"/><rect x="949" y="196" width="1" height="570" fill="#e3e7ec"/><rect x="49" y="197" width="900" height="92" fill="#ffffff"/><rect x="49" y="288" width="900" height="1" fill="#e3e7ec"/><text x="67" y="224" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Already there</text><text x="275" y="226" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">EnquiryForm.jsx</text><text x="391.422" y="226" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">collects fullname, mobile, email, experience — the same fields a checkout </text><text x="275" y="247" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">needs. Reuse the atoms (</text><text x="444.75" y="247" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">InputBoxComponent</text><text x="572.688" y="247" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">, </text><text x="579.094" y="247" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">ButtonComponent</text><text x="691.984" y="247" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">) rather than introducing a second </text><text x="275" y="268" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">form language.</text><rect x="49" y="289" width="900" height="71" fill="#f8fafb"/><rect x="49" y="359" width="900" height="1" fill="#e3e7ec"/><text x="67" y="316" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Backend</text><text x="275" y="318" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">trcabe.onrender.com</text><text x="421.531" y="318" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">already takes enquiries. An order endpoint sits beside it: create Razorpay </text><text x="275" y="339" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">order, verify the signature server-side, store the ref code.</text><rect x="49" y="360" width="900" height="71" fill="#ffffff"/><rect x="49" y="430" width="900" height="1" fill="#e3e7ec"/><text x="67" y="387" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Never trust the client</text><text x="275" y="389" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">The amount must come from the server, not a form field. A price posted from the browser is a </text><text x="275" y="410" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">price the browser can change.</text><rect x="49" y="431" width="900" height="71" fill="#f8fafb"/><rect x="49" y="501" width="900" height="1" fill="#e3e7ec"/><text x="67" y="458" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Verify the signature</text><text x="275" y="460" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Razorpay's webhook signature check server-side is what makes a payment real. Redirect alone </text><text x="275" y="481" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">can be forged.</text><rect x="49" y="502" width="900" height="71" fill="#ffffff"/><rect x="49" y="572" width="900" height="1" fill="#e3e7ec"/><text x="67" y="529" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Carry the ref code</text><text x="275" y="531" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Put it in Razorpay </text><text x="397.531" y="531" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">notes</text><text x="438.703" y="531" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">on order creation. That is what makes #51's rev-share dashboard a query </text><text x="275" y="552" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">rather than a manual count.</text><rect x="49" y="573" width="900" height="50" fill="#f8fafb"/><rect x="49" y="622" width="900" height="1" fill="#e3e7ec"/><text x="67" y="600" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Idempotency</text><text x="275" y="602" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">A student who double-taps must not create two orders. Key on enquiry id + batch.</text><rect x="49" y="623" width="900" height="71" fill="#ffffff"/><rect x="49" y="693" width="900" height="1" fill="#e3e7ec"/><text x="67" y="650" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Failure path</text><text x="275" y="652" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Not designed here, and it needs to be: card declined, UPI timeout, browser closed mid-payment. </text><text x="275" y="673" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">On a ₹35,000 payment this is the screen that decides whether they retry or ring a competitor.</text><rect x="49" y="694" width="900" height="71" fill="#f8fafb"/><rect x="49" y="764" width="900" height="1" fill="#e3e7ec"/><text x="67" y="721" font-family="Montserrat" font-size="13.5" font-weight="700" fill="#03084c" xml:space="preserve">Receipt</text><text x="275" y="723" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Razorpay sends its own. The WhatsApp confirmation is RCA's, and it is the one their audience will </text><text x="275" y="744" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">actually read.</text><text x="1112" y="209" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">WHAT I DID NOT DECIDE</text><text x="1112" y="232" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">The fee is ₹35,000 from the SOW in </text><text x="1112" y="253" font-family="monospace" font-size="12.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">OPERATIONS.md</text><text x="1209.844" y="253" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">. Everything else commercial — </text><text x="1112" y="274" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">deposit vs full, public pricing, refund window — is </text><text x="1112" y="295" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Nik's and is asked on the previous board.</text><text x="1112" y="330" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">NOT DESIGNED YET</text><text x="1112" y="353" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">Payment failure and retry, refund/cancellation </text><text x="1112" y="374" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">copy, and the desktop layout (same column, </text><text x="1112" y="395" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">centred). Say the word and they are quick.</text><text x="1112" y="430" font-family="Montserrat" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="0.88" xml:space="preserve">REFUNDS</text><text x="1112" y="453" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">A seat-booking deposit implies a refund policy. If </text><text x="1112" y="474" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">there is one, it belongs on the checkout screen </text><text x="1112" y="495" font-family="Montserrat" font-size="13.5" font-weight="400" fill="#4a4a4a" xml:space="preserve">above the pay button, not in a terms link.</text></svg>