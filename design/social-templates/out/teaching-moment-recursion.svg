  <text x="96" y="436" font-family="Montserrat, 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="96" dy="0">Recursion is a</tspan><tspan x="96" dy="82.1">function calling</tspan><tspan x="96" dy="82.1">itself</tspan></text>

